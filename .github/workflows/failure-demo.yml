
name: CampusFind Failure Demonstrations

on:
  workflow_dispatch:

jobs:
  intentional-failures:
    name: Run Intentional Failure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run intentional failure demonstrations
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.segotlo.campusfindapp.util.PasswordValidatorFailureDemoTest.passwordContainingDigitDemonstratesIncorrectExpectation" \
            --tests "com.segotlo.campusfindapp.data.ReportSearchFilterFailureDemoTest.searchShouldFindPassportButDemonstratesIncorrectExpectation" \
            --tests "com.segotlo.campusfindapp.util.AIMatchingEngineTest.intentionallyIncorrectConfidenceTest" \
            --tests "com.segotlo.campusfindapp.util.RegistrationValidatorTest.invalidPasswordShouldBeAccepted"
