
name: CampusFind Passing CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test CampusFind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run passing unit tests only
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.segotlo.campusfindapp.util.PasswordValidatorTest" \
            --tests "com.segotlo.campusfindapp.data.ReportSearchFilterTest" \
            --tests "com.segotlo.campusfindapp.data.UserModelTest" \
            --tests "com.segotlo.campusfindapp.util.AIMatchingEnginePassingDemoTest" \
            --tests "com.segotlo.campusfindapp.util.AIMatchingEnginePassingTest" \
            --tests "com.segotlo.campusfindapp.util.RegistrationValidatorPassingDemoTest" \
            --tests "com.segotlo.campusfindapp.data.ReportSearchFilterPassingTest"
      - name: Build CampusFind APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusFind-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
